<!DOCTYPE html>
<html>
<head>
    <title>Gallery View</title>
</head>
<body style="background:black; text-align:center;">

{% if media.endswith('.mp4') %}
    <video controls autoplay style="width:80%; margin-top:40px;">
        <source src="{{ url_for('static', filename='videos/' + media) }}" type="video/mp4">
    </video>
{% else %}
    <img src="{{ url_for('static', filename='images/' + media) }}"
         style="width:80%; margin-top:40px;">
{% endif %}

</body>
</html>
