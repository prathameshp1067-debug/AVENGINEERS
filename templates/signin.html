<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Avengineers - Sign In</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <!-- Navbar -->
  
    <div class="menu">
      <div class="menu-icon">⋮</div>
      <ul class="menu-list">
        <li><a href="/">Fleet</a></li>
        <li><a href="/vision">Our Vision</a></li>
        <li><a href="/team">Team</a></li>
        <li><a href="/achievements">Achievements</a></li>
        <li><a href="{{ url_for('teamwork') }}" class="active">Gallery</a></li>
        <<li><a href="/contact">Contact</a></li>
        <li><a href="{{ url_for('news') }}" >News and Updates</a></li>

      </ul>
    </div>
  </header>

  <!-- Sign In Section -->
  <section class="signin">
    <h2>SIGN IN</h2>
    <form action="/signin" method="post" class="signin-form">
      <label for="email">Email</label>
      <input type="text" id="email" name="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>

      <button type="submit" class="btn">Sign In</button>
    </form>
    <p style="margin-top:15px;">Don’t have an account? <a href="/" style="color:#00bfff;">Create one here</a></p>
  </section>

  <!-- Footer -->
  <footer>
    <p>© 2026 Avengineers. All rights reserved.</p>
  </footer>

  <!-- Script for 3-dot menu -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const menu = document.querySelector(".menu");
      const icon = document.querySelector(".menu-icon");
      icon.addEventListener("click", function() {
        menu.classList.toggle("active");
      });
    });
  </script>
</body>
</html>
