<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Achievements</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header class="navbar">

    <div class="logo">
        <img src="{{ url_for('static', filename='images/logo.png') }}"
             alt="Logo"
             class="logo-img">
        <span>AVENGINEERS</span>
    </div>

    <div class="menu">

        <div class="menu-box">
            <div class="menu-icon">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <ul class="menu-list">
            <li><a href="/home">Fleet</a></li>
            <li><a href="/vision">Our Vision</a></li>
            <li><a href="/team">Team</a></li>
            <li><a href="/achievements" class="active">Achievements</a></li>
            <li><a href="/teamwork">Gallery</a></li>
            <li><a href="/contact">Contact</a></li>
            <li><a href="/news">News and Updates</a></li>
        </ul>

    </div>

</header>

<section class="achievements">

    <h2>Our Achievements</h2>

    <div class="achievements-container">

        {% for achievement in achievements %}
        <div class="achievement-card">
            <h3>{{ achievement.title }}</h3>
            <p>{{ achievement.year }}</p>
        </div>
        {% endfor %}

    </div>

    <br><br>

    <img src="{{ url_for('static', filename='images/work1.jpg') }}"
         alt="Team working together"
         style="width:500px; height:auto; border-radius:40px;">

</section>

<footer>
    <p>© 2026 AVENGINEERS. All rights reserved.</p>
</footer>

<script>

/* MENU */

document.addEventListener("DOMContentLoaded", function () {

    const menu = document.querySelector(".menu");
    const menuBox = document.querySelector(".menu-box");

    menuBox.addEventListener("click", function () {
        menu.classList.toggle("active");
    });

});

/* VOICE WELCOME */

let hasSpoken = false;

document.addEventListener("click", function() {

    if(hasSpoken) return;

    hasSpoken = true;

    const speech = new SpeechSynthesisUtterance(
        "Hello. I am Avengineers AI assistant. Welcome to our website. Prepare for takeoff."
    );

    speech.rate = 0.85;
    speech.pitch = 0.7;
    speech.volume = 1;

    speechSynthesis.speak(speech);

});

</script>

</body>
</html>
