<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AVENGINEERS - Home</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<header class="navbar">

  <div class="logo">
    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" class="logo-img">
    <span>AVENGINEERS</span>
  </div>

  <div class="menu">
    <div class="menu-icon">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <ul class="menu-list">
      <li><a href="/home" class="active">Fleet</a></li>
      <li><a href="/vision">Our Vision</a></li>
      <li><a href="/team">Team</a></li>
      <li><a href="/achievements">Achievements</a></li>
      <li><a href="/teamwork">Gallery</a></li>
      <li><a href="/contact">Contact</a></li>
      <li><a href="/news">News and Updates</a></li>
    </ul>
  </div>

</header>

<section class="scroll-video-section">

  <video id="scrollVideo" class="scroll-video" muted playsinline preload="auto">
    <source src="{{ url_for('static', filename='videos/aircraft-scroll.mp4') }}" type="video/mp4">
  </video>

  <div class="scroll-text">
    <h1>AVENGINEERS</h1>
    <h2>ENGINEER THE SKY</h2>
  </div>

</section>

<script>
const video = document.getElementById("scrollVideo");
const section = document.querySelector(".scroll-video-section");

video.addEventListener("loadedmetadata", function () {
  window.addEventListener("scroll", function () {
    const sectionTop = section.offsetTop;
    const sectionHeight = section.offsetHeight - window.innerHeight;
    const scrollY = window.scrollY - sectionTop;

    let progress = scrollY / sectionHeight;
    progress = Math.min(Math.max(progress, 0), 1);

    video.currentTime = progress * video.duration;
  });
});
</script>
<footer>
  <p>© 2026 AVENGINEERS. All rights reserved.</p>
</footer>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const menu = document.querySelector(".menu");
  const icon = document.querySelector(".menu-icon");

  icon.addEventListener("click", function () {
    menu.classList.toggle("active");
  });
});
</script>

</body>
</html>
